<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Validasi Data KBLI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff;
            background-image: linear-gradient(to bottom right, #f0f9ff, #e0f2fe);
        }
        .tab-button {
            transition: all 0.3s ease;
        }
        .tab-button.active {
            background-color: #0284c7; /* sky-600 */
            color: white;
            box-shadow: 0 4px 14px 0 rgb(0 119 255 / 39%);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loader {
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-input-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .form-card, #form-header { background-color: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05); border: 1px solid #e2e8f0; transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); opacity: 0; transform: translateY(30px); }
        #form-header { padding: 1rem; }
        .form-card.visible, #form-header.visible { opacity: 1; transform: translateY(0); }
        .submit-button { transition: all 0.3s ease; }
        .submit-button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgb(14 165 233 / 0.3); }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-5xl mx-auto space-y-8">
        <header class="text-center" id="form-header">
            <h1 class="text-3xl font-bold text-slate-800">Aplikasi Validasi Data KBLI</h1>
            <p class="text-slate-500 mt-2">Input dan lihat data validasi Anda dalam satu tempat.</p>
        </header>

        <!-- Navigasi Tab -->
        <div class="bg-sky-100 p-2 rounded-xl flex space-x-2">
            <button class="tab-button active w-1/2 py-3 rounded-lg font-semibold" data-tab="form">Formulir Input</button>
            <button class="tab-button w-1/2 py-3 rounded-lg font-semibold" data-tab="data">Lihat Data</button>
        </div>

        <!-- Konten Tab -->
        <div>
            <!-- Tab 1: Formulir -->
            <div id="tab-form" class="tab-content active">
                 <form id="data-form" novalidate class="space-y-8">
                    <div class="form-card">
                        <h2 class="text-xl font-semibold text-slate-700 border-b border-slate-200 pb-4 mb-6 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            Informasi Utama
                        </h2>
                        <div class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="kode_kbli" class="block text-sm font-medium text-slate-600 mb-1">Kode KBLI</label>
                                    <input type="text" id="kode_kbli" name="kode_kbli" placeholder="e.g., 01111" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                                </div>
                                <div>
                                    <label for="kode_rla" class="block text-sm font-medium text-slate-600 mb-1">Kode RLA</label>
                                    <input type="text" id="kode_rla" name="kode_rla" placeholder="e.g., 123" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                                </div>
                            </div>
                            <div>
                                <label for="uraian_ruang_lingkup" class="block text-sm font-medium text-slate-600 mb-1">Uraian Ruang Lingkup</label>
                                <textarea id="uraian_ruang_lingkup" name="uraian_ruang_lingkup" rows="3" placeholder="Jelaskan ruang lingkup secara detail di sini..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="form-card">
                        <h2 class="text-xl font-semibold text-slate-700 border-b border-slate-200 pb-4 mb-6 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                            Tingkat Resiko
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Mikro" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Mikro</label>
                                <div class="flex items-center space-x-4"><label class="flex items-center text-sm"><input type="radio" name="status_risiko_mikro" value="Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center text-sm"><input type="radio" name="status_risiko_mikro" value="Tidak Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Tdk Sesuai</label></div>
                                <div class="flex items-center space-x-2"><label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg><span>Unggah</span><input type="file" name="file_risiko_mikro" onchange="updateFileName(this)"></label><span class="flex-grow text-xs text-slate-500 p-2 bg-slate-100 rounded-md truncate transition-colors" data-file-name="file_risiko_mikro">Tidak ada file.</span></div>
                                <textarea name="catatan_risiko_mikro" rows="2" placeholder="Catatan khusus untuk Resiko Mikro..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Kecil" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Kecil</label>
                                <div class="flex items-center space-x-4"><label class="flex items-center text-sm"><input type="radio" name="status_risiko_kecil" value="Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center text-sm"><input type="radio" name="status_risiko_kecil" value="Tidak Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Tdk Sesuai</label></div>
                                <div class="flex items-center space-x-2"><label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg><span>Unggah</span><input type="file" name="file_risiko_kecil" onchange="updateFileName(this)"></label><span class="flex-grow text-xs text-slate-500 p-2 bg-slate-100 rounded-md truncate transition-colors" data-file-name="file_risiko_kecil">Tidak ada file.</span></div>
                                <textarea name="catatan_risiko_kecil" rows="2" placeholder="Catatan khusus untuk Resiko Kecil..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Menengah" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Menengah</label>
                                <div class="flex items-center space-x-4"><label class="flex items-center text-sm"><input type="radio" name="status_risiko_menengah" value="Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center text-sm"><input type="radio" name="status_risiko_menengah" value="Tidak Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Tdk Sesuai</label></div>
                                <div class="flex items-center space-x-2"><label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg><span>Unggah</span><input type="file" name="file_risiko_menengah" onchange="updateFileName(this)"></label><span class="flex-grow text-xs text-slate-500 p-2 bg-slate-100 rounded-md truncate transition-colors" data-file-name="file_risiko_menengah">Tidak ada file.</span></div>
                                <textarea name="catatan_risiko_menengah" rows="2" placeholder="Catatan khusus untuk Resiko Menengah..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Besar" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Besar</label>
                                <div class="flex items-center space-x-4"><label class="flex items-center text-sm"><input type="radio" name="status_risiko_besar" value="Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center text-sm"><input type="radio" name="status_risiko_besar" value="Tidak Sesuai" class="mr-1 h-4 w-4 text-sky-600"> Tdk Sesuai</label></div>
                                <div class="flex items-center space-x-2"><label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg><span>Unggah</span><input type="file" name="file_risiko_besar" onchange="updateFileName(this)"></label><span class="flex-grow text-xs text-slate-500 p-2 bg-slate-100 rounded-md truncate transition-colors" data-file-name="file_risiko_besar">Tidak ada file.</span></div>
                                <textarea name="catatan_risiko_besar" rows="2" placeholder="Catatan khusus untuk Resiko Besar..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="form-card">
                        <h2 class="text-xl font-semibold text-slate-700 border-b border-slate-200 pb-4 mb-6 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                            Kewenangan, Persyaratan, & Kewajiban
                        </h2>
                        <div class="space-y-8">
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="block text-sm font-medium text-slate-600">Kewenangan</label>
                                <div class="flex items-center space-x-6"><label class="flex items-center"><input type="radio" name="status_kewenangan" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center"><input type="radio" name="status_kewenangan" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600"> Tidak Sesuai</label></div>
                                <input type="text" name="nomor_kewenangan" placeholder="Masukkan nomor Kewenangan" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition">
                                <textarea name="catatan_kewenangan" rows="2" placeholder="Catatan khusus untuk Kewenangan..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="block text-sm font-medium text-slate-600">Persyaratan</label>
                                <div class="flex items-center space-x-6"><label class="flex items-center"><input type="radio" name="status_persyaratan" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center"><input type="radio" name="status_persyaratan" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600"> Tidak Sesuai</label></div>
                                <input type="text" name="nomor_persyaratan" placeholder="Masukkan nomor Persyaratan" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition">
                                <textarea name="catatan_persyaratan" rows="2" placeholder="Catatan khusus untuk Persyaratan..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                            <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                                <label class="block text-sm font-medium text-slate-600">Kewajiban</label>
                                <div class="flex items-center space-x-6"><label class="flex items-center"><input type="radio" name="status_kewajiban" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600"> Sesuai</label><label class="flex items-center"><input type="radio" name="status_kewajiban" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600"> Tidak Sesuai</label></div>
                                <input type="text" name="nomor_kewajiban" placeholder="Masukkan nomor Kewajiban" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition">
                                <textarea name="catatan_kewajiban" rows="2" placeholder="Catatan khusus untuk Kewajiban..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col items-center justify-center pt-4">
                        <button type="submit" id="submit-button" class="submit-button w-full md:w-auto px-12 py-3 bg-sky-600 text-white font-semibold rounded-lg shadow-lg flex items-center justify-center text-lg bg-gradient-to-r from-sky-500 to-cyan-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                            <span id="submit-text">Kirim Data</span>
                            <div id="submit-loader" class="loader h-6 w-6 rounded-full border-2 border-t-2 ml-3 hidden"></div>
                        </button>
                        <div id="message" class="text-center font-medium mt-4 h-6"></div>
                    </div>
                </form>
            </div>

            <div id="tab-data" class="tab-content">
                <div class="form-card visible">
                    <h2 class="text-xl font-semibold text-slate-700 pb-4 mb-6 flex items-center justify-between">
                        <span>Data Validasi KBLI</span>
                        <button id="refresh-button" class="px-4 py-2 bg-sky-500 text-white text-sm font-semibold rounded-lg hover:bg-sky-600 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 110 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                            Refresh
                        </button>
                    </h2>
                    <div id="data-container" class="overflow-x-auto">
                        <!-- Data akan dimuat di sini oleh JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9dJ4gc15s0fRYfXVBgqz1X1TWl6dXqFz683bl6bldh2V923wMJ5ZPg4cN2YGHkmWNrQ/exec';
        
        const form = document.getElementById('data-form');
        const submitButton = document.getElementById('submit-button');
        const submitText = document.getElementById('submit-text');
        const submitLoader = document.getElementById('submit-loader');
        const message = document.getElementById('message');

        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetTab = button.dataset.tab;
                tabButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                tabContents.forEach(content => {
                    content.classList.remove('active');
                    if (content.id === `tab-${targetTab}`) {
                        content.classList.add('active');
                    }
                });
                if (targetTab === 'data') {
                    fetchData();
                }
            });
        });

        const dataContainer = document.getElementById('data-container');
        const refreshButton = document.getElementById('refresh-button');

        async function fetchData() {
            dataContainer.innerHTML = `<div class="flex justify-center items-center p-10"><div class="loader h-12 w-12 rounded-full border-4 border-t-4 border-gray-200"></div></div>`;
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                if (result.error) {
                    throw new Error(result.error);
                }
                renderData(result);
            } catch (error) {
                console.error('Error fetching data:', error);
                dataContainer.innerHTML = `<p class="text-center text-red-500">Gagal memuat data. Pastikan skrip Google Apps sudah di-deploy dengan benar.</p>`;
            }
        }

        function renderData(data) {
            if (!data || data.length === 0) {
                dataContainer.innerHTML = `<p class="text-center text-slate-500">Belum ada data yang tersimpan.</p>`;
                return;
            }
            
            let tableHTML = `<table class="min-w-full divide-y divide-slate-200"><thead class="bg-slate-50"><tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Info Utama</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Kategori</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Status</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider">Catatan</th>
                    </tr></thead><tbody class="bg-white divide-y divide-slate-200">`;

            const groupedData = data.reduce((acc, row) => {
                const id = row.IDUnik;
                if (!acc[id]) {
                    acc[id] = {
                        kodeKbli: row.KodeKBLI,
                        timestamp: new Date(row.Timestamp).toLocaleString('id-ID'),
                        items: []
                    };
                }
                acc[id].items.push(row);
                return acc;
            }, {});

            for (const id in groupedData) {
                const entry = groupedData[id];
                tableHTML += `<tr class="bg-sky-50"><td colspan="4" class="px-4 py-2 font-bold text-sky-800">KBLI: ${entry.kodeKbli} <span class="font-normal text-slate-500 text-sm ml-4">${entry.timestamp}</span></td></tr>`;
                entry.items.forEach(item => {
                    const statusClass = item.Status === 'Sesuai' ? 'bg-green-100 text-green-800' : item.Status === 'Tidak Sesuai' ? 'bg-red-100 text-red-800' : '';
                    tableHTML += `<tr>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-700">${item.Kategori}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-slate-500">${item.SubKategori}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm"><span class="px-2 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusClass}">${item.Status || '-'}</span></td>
                        <td class="px-4 py-3 text-sm text-slate-500">${item.CatatanKhusus || '-'}</td>
                    </tr>`;
                });
            }

            tableHTML += `</tbody></table>`;
            dataContainer.innerHTML = tableHTML;
        }
        
        refreshButton.addEventListener('click', fetchData);
        fetchData();

        function updateFileName(input) {
            const name = input.name;
            const fileNameDisplay = document.querySelector(`[data-file-name="${name}"]`);
            if (input.files.length > 0) {
                fileNameDisplay.textContent = input.files[0].name;
                fileNameDisplay.classList.remove('bg-slate-100', 'text-slate-500');
                fileNameDisplay.classList.add('bg-green-100', 'text-green-800');
            }
        }
        window.updateFileName = updateFileName;

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitButton.disabled = true;
            submitText.classList.add('hidden');
            submitLoader.classList.remove('hidden');
            message.textContent = '';

            const formData = new FormData(form);
            const data = {};
            for (const [key, value] of formData.entries()) {
                if (key !== 'pilihan_risiko' && !key.startsWith('file_')) { data[key] = value; }
            }
            data['pilihan_risiko'] = Array.from(formData.getAll('pilihan_risiko'));

            const fileInputs = form.querySelectorAll('input[type="file"]');
            for (const input of fileInputs) {
                if (input.files[0]) {
                    data[input.name] = {
                        filename: input.files[0].name,
                        mimeType: input.files[0].type,
                        content: await fileToBase64(input.files[0])
                    };
                }
            }

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
                const result = await response.json();
                if (result.status === "success") {
                    message.textContent = 'Data berhasil dikirim!';
                    message.classList.add('text-green-600');
                    form.reset();
                    document.querySelectorAll('[data-file-name]').forEach(el => {
                        el.textContent = 'Tidak ada file.';
                        el.classList.remove('bg-green-100', 'text-green-800');
                        el.classList.add('bg-slate-100', 'text-slate-500');
                    });
                    setTimeout(() => {
                        document.querySelector('.tab-button[data-tab="data"]').click();
                        message.textContent = '';
                    }, 1000);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                message.textContent = `Gagal mengirim data: ${error.message}`;
                message.classList.add('text-red-500');
            } finally {
                submitButton.disabled = false;
                submitText.classList.remove('hidden');
                submitLoader.classList.add('hidden');
            }
        });

        const animatedElements = document.querySelectorAll('#form-header, .form-card');
        animatedElements.forEach((el, index) => {
            setTimeout(() => {
                el.classList.add('visible');
            }, (index + 1) * 150);
        });
    });
</script>

</body>
</html>
