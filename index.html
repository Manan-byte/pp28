<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validasi Data KBLI - Desain Animasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f9ff; /* sky-50 */
            background-image: linear-gradient(to bottom right, #f0f9ff, #e0f2fe);
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .loader {
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Styling & Animasi Kartu */
        .form-card, #form-header {
            background-color: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            border: 1px solid #e2e8f0; /* slate-200 */
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: translateY(30px);
        }
        #form-header {
             padding: 1rem;
        }
        .form-card.visible, #form-header.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .form-card:focus-within {
            box-shadow: 0 10px 15px -3px rgb(14 165 233 / 0.1), 0 4px 6px -4px rgb(14 165 233 / 0.1);
            border-color: #38bdf8; /* sky-400 */
        }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: none;
            border-color: #0ea5e9; /* sky-500 */
            ring-width: 0;
        }
        /* Animasi Tombol Submit */
        .submit-button {
            transition: all 0.3s ease;
        }
        .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgb(14 165 233 / 0.3);
        }
        .submit-button:active {
            transform: translateY(0px);
            box-shadow: 0 4px 10px -3px rgb(14 165 233 / 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-3xl space-y-8">
        
        <header class="text-center" id="form-header">
            <div class="inline-block p-4 bg-sky-100 rounded-2xl mb-4">
                 <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800">Formulir Validasi Data KBLI</h1>
            <p class="text-slate-500 mt-2">Lengkapi data berikut untuk melanjutkan proses validasi.</p>
        </header>

        <form id="data-form" novalidate class="space-y-8">
            <!-- KARTU 1: INFORMASI UTAMA -->
            <div class="form-card">
                <h2 class="text-xl font-semibold text-slate-700 border-b border-slate-200 pb-4 mb-6 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Informasi Utama
                </h2>
                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="kode_kbli" class="block text-sm font-medium text-slate-600 mb-1">Kode KBLI</label>
                            <input type="text" id="kode_kbli" name="kode_kbli" placeholder="e.g., 01111" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                        </div>
                        <div>
                            <label for="kode_rla" class="block text-sm font-medium text-slate-600 mb-1">Kode RLA</label>
                            <input type="text" id="kode_rla" name="kode_rla" placeholder="e.g., 123" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                        </div>
                    </div>
                    <div>
                        <label for="uraian_ruang_lingkup" class="block text-sm font-medium text-slate-600 mb-1">Uraian Ruang Lingkup</label>
                        <textarea id="uraian_ruang_lingkup" name="uraian_ruang_lingkup" rows="3" placeholder="Jelaskan ruang lingkup secara detail di sini..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition"></textarea>
                    </div>
                </div>
            </div>

            <!-- KARTU 2: TINGKAT RESIKO -->
            <div class="form-card">
                <h2 class="text-xl font-semibold text-slate-700 border-b border-slate-200 pb-4 mb-6 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                    Tingkat Resiko
                </h2>
                <div class="space-y-6">
                    <div>
                        <span class="block text-sm font-medium text-slate-600 mb-2">Status Keseluruhan</span>
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center"><input type="radio" name="status_risiko" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Sesuai</label>
                            <label class="flex items-center"><input type="radio" name="status_risiko" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Tidak Sesuai</label>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                            <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Mikro" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Mikro</label>
                            <div class="flex items-center space-x-2">
                                <label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                    <span>Unggah Bukti</span>
                                    <input type="file" name="file_risiko_mikro" onchange="updateFileName(this)">
                                </label>
                                <span class="text-sm text-slate-500 truncate" data-file-name="file_risiko_mikro">Tidak ada file.</span>
                            </div>
                            <textarea name="catatan_risiko_mikro" rows="2" placeholder="Catatan khusus untuk Resiko Mikro..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                        </div>
                        <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                            <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Kecil" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Kecil</label>
                            <div class="flex items-center space-x-2">
                                <label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition">
                                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                    <span>Unggah Bukti</span>
                                    <input type="file" name="file_risiko_kecil" onchange="updateFileName(this)">
                                </label>
                                <span class="text-sm text-slate-500 truncate" data-file-name="file_risiko_kecil">Tidak ada file.</span>
                            </div>
                            <textarea name="catatan_risiko_kecil" rows="2" placeholder="Catatan khusus untuk Resiko Kecil..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                        </div>
                        <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                            <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Menengah" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Menengah</label>
                             <div class="flex items-center space-x-2">
                                <label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition">
                                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                    <span>Unggah Bukti</span>
                                    <input type="file" name="file_risiko_menengah" onchange="updateFileName(this)">
                                </label>
                                <span class="text-sm text-slate-500 truncate" data-file-name="file_risiko_menengah">Tidak ada file.</span>
                            </div>
                            <textarea name="catatan_risiko_menengah" rows="2" placeholder="Catatan khusus untuk Resiko Menengah..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                        </div>
                        <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                            <label class="flex items-center font-medium"><input type="checkbox" name="pilihan_risiko" value="Besar" class="mr-2 h-4 w-4 rounded text-sky-600 focus:ring-sky-500 border-slate-300"> Besar</label>
                            <div class="flex items-center space-x-2">
                                <label class="file-input-wrapper px-4 py-2 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg hover:bg-slate-200 cursor-pointer transition">
                                     <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                    <span>Unggah Bukti</span>
                                    <input type="file" name="file_risiko_besar" onchange="updateFileName(this)">
                                </label>
                                <span class="text-sm text-slate-500 truncate" data-file-name="file_risiko_besar">Tidak ada file.</span>
                            </div>
                            <textarea name="catatan_risiko_besar" rows="2" placeholder="Catatan khusus untuk Resiko Besar..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- KARTU 3: KEWENANGAN, DLL -->
            <div class="form-card">
                <h2 class="text-xl font-semibold text-slate-700 border-b border-slate-200 pb-4 mb-6 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3 text-sky-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                    Kewenangan, Persyaratan, & Kewajiban
                </h2>
                <div class="space-y-8">
                    <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                        <label class="block text-sm font-medium text-slate-600">Kewenangan</label>
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center"><input type="radio" name="status_kewenangan" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Sesuai</label>
                            <label class="flex items-center"><input type="radio" name="status_kewenangan" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Tidak Sesuai</label>
                        </div>
                        <input type="text" name="nomor_kewenangan" placeholder="Masukkan nomor Kewenangan" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition">
                        <textarea name="catatan_kewenangan" rows="2" placeholder="Catatan khusus untuk Kewenangan..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                    </div>
                    <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                        <label class="block text-sm font-medium text-slate-600">Persyaratan</label>
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center"><input type="radio" name="status_persyaratan" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Sesuai</label>
                            <label class="flex items-center"><input type="radio" name="status_persyaratan" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Tidak Sesuai</label>
                        </div>
                        <input type="text" name="nomor_persyaratan" placeholder="Masukkan nomor Persyaratan" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition">
                        <textarea name="catatan_persyaratan" rows="2" placeholder="Catatan khusus untuk Persyaratan..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                    </div>
                    <div class="p-4 bg-slate-50/50 rounded-lg border border-slate-200 space-y-3">
                        <label class="block text-sm font-medium text-slate-600">Kewajiban</label>
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center"><input type="radio" name="status_kewajiban" value="Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Sesuai</label>
                            <label class="flex items-center"><input type="radio" name="status_kewajiban" value="Tidak Sesuai" class="mr-2 h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300"> Tidak Sesuai</label>
                        </div>
                        <input type="text" name="nomor_kewajiban" placeholder="Masukkan nomor Kewajiban" class="w-full px-4 py-2 border border-slate-300 rounded-lg transition">
                        <textarea name="catatan_kewajiban" rows="2" placeholder="Catatan khusus untuk Kewajiban..." class="w-full px-4 py-2 border border-slate-300 rounded-lg transition text-sm"></textarea>
                    </div>
                </div>
            </div>

            <!-- TOMBOL SUBMIT -->
            <div class="flex flex-col items-center justify-center pt-4">
                <button type="submit" id="submit-button" class="submit-button w-full md:w-auto px-12 py-3 bg-sky-600 text-white font-semibold rounded-lg shadow-lg flex items-center justify-center text-lg bg-gradient-to-r from-sky-500 to-cyan-500">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                    <span id="submit-text">Kirim Data</span>
                    <div id="submit-loader" class="loader h-6 w-6 rounded-full border-2 border-t-2 ml-3 hidden"></div>
                </button>
                <div id="message" class="text-center font-medium mt-4 h-6"></div>
            </div>
        </form>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzRwbnFHbkbnRY6aOU0QWpIydiRnm8R8TnPPjQNPi_y0AwbAS6F35zJQ_2hMw_hWzzjtA/exec';
        const form = document.getElementById('data-form');
        const submitButton = document.getElementById('submit-button');
        const submitText = document.getElementById('submit-text');
        const submitLoader = document.getElementById('submit-loader');
        const message = document.getElementById('message');
        
        // Animasi saat halaman dimuat
        const animatedElements = document.querySelectorAll('#form-header, .form-card');
        animatedElements.forEach((el, index) => {
            setTimeout(() => {
                el.classList.add('visible');
            }, (index + 1) * 150);
        });

        function updateFileName(input) {
            const name = input.name;
            const fileName = input.files.length > 0 ? input.files[0].name : 'Tidak ada file.';
            document.querySelector(`[data-file-name="${name}"]`).textContent = fileName;
        }
        window.updateFileName = updateFileName; // Membuat fungsi dapat diakses dari HTML

        const fileToBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitButton.disabled = true;
            submitText.classList.add('hidden');
            submitLoader.classList.remove('hidden');
            message.textContent = '';
            message.classList.remove('text-green-600', 'text-red-500');

            const formData = new FormData(form);
            const data = {};
            
            for (const [key, value] of formData.entries()) {
                if (key !== 'pilihan_risiko' && !key.startsWith('file_')) {
                    data[key] = value;
                }
            }
            
            data['pilihan_risiko'] = Array.from(formData.getAll('pilihan_risiko'));

            const fileInputs = form.querySelectorAll('input[type="file"]');
            for (const input of fileInputs) {
                if (input.files[0]) {
                    try {
                        const content = await fileToBase64(input.files[0]);
                        data[input.name] = {
                            filename: input.files[0].name,
                            mimeType: input.files[0].type,
                            content: content
                        };
                    } catch (error) {
                        console.error('Error converting file:', error);
                        message.textContent = `Gagal memproses file: ${input.files[0].name}.`;
                        message.classList.add('text-red-500');
                        submitButton.disabled = false;
                        submitText.classList.remove('hidden');
                        submitLoader.classList.add('hidden');
                        return;
                    }
                } else {
                     data[input.name] = null;
                }
            }

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                
                message.textContent = 'Data berhasil dikirim! Formulir akan direset.';
                message.classList.add('text-green-600');
                
                setTimeout(() => {
                    form.reset();
                    document.querySelectorAll('[data-file-name]').forEach(el => el.textContent = 'Tidak ada file.');
                    message.textContent = '';
                }, 2500);

            } catch (error) {
                console.error('Error!', error.message);
                message.textContent = `Gagal mengirim data. Error: ${error.message}.`;
                message.classList.add('text-red-500');
            } finally {
                submitButton.disabled = false;
                submitText.classList.remove('hidden');
                submitLoader.classList.add('hidden');
            }
        });
    });
</script>
</body>
</html>
